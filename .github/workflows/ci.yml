name: 検査

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      # checks.tests はすべてのバリエーションを組んでから流すので、nix build も兼ねる。
      - run: nix flake check -L
      - name: 大きさ
        run: |
          nix build -L
          {
            echo '| ファイル | ttf | woff2 |'
            echo '|---|--:|--:|'
            for f in result/share/fonts/truetype/*.ttf; do
              stem=$(basename "$f" .ttf)
              echo "| $stem | $(stat -Lc %s "$f") | $(stat -Lc %s "result/share/fonts/woff2/$stem.woff2") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
